user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format audit_log '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent rt=$request_time '
                         'upstream_addr="$upstream_addr" '
                         'upstream_status="$upstream_status" '
                         'upstream_response_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log audit_log buffer=64k flush=1s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream: Least Connections (LC Dinamis tanpa bobot)
    upstream backend_cluster {
        least_conn;
        server web-backend-1:8080 max_fails=3 fail_timeout=10s;
        server web-backend-2:8080 max_fails=3 fail_timeout=10s;
        server web-backend-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
}
