global
    log stdout format raw local0
    maxconn 20000
    stats socket /tmp/haproxy.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_in
    bind *:80
    default_backend web_backends

backend web_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web1 web-backend-1:8080 check weight 1
    server web2 web-backend-2:8080 check weight 1
    server web3 web-backend-3:8080 check weight 1

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
